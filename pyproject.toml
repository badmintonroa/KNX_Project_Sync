[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # XML templates in the fixture generator
  "E741",    # `l` for links, as in the knx2home sources
  "RUF001",  # German texts with typographic characters
  "RUF003",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "helpers", "xknx_digest", "compare", "build_fixtures"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# the port mirrors the structure of the knx2home TypeScript sources: closures are
# only called inside the loop iteration that defines them, nesting follows the TS code
"custom_components/knx2home_importer/mapping/*" = ["B023", "SIM102"]
